name: Package Shard Test

on:
  workflow_call:
    inputs:
      rt_thread_version:
        description: RT-Thread branch or tag selector
        required: true
        type: string
      bsp:
        description: BSP and toolchain selector
        required: true
        type: string
      packages:
        description: Space-separated package names
        required: true
        type: string
      artifact_name:
        description: Unique artifact name for this shard
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages-test:
    name: ${{ inputs.artifact_name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: repository

      - uses: actions/checkout@v4
        with:
          repository: RT-Thread/pkgs-test
          ref: 8bdeeb41a7ed6bb8658486b568190a9717f06e08
          path: pkgs-test

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc git libncurses5-dev tree qemu-system-arm
          python3 -m pip install scons==4.4.0 requests tqdm wget dominate PyGithub pytz psutil kconfiglib

      - name: Copy packages repository
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/pkgs-test/env/packages"
          cp -r "${{ github.workspace }}/repository" "${{ github.workspace }}/pkgs-test/env/packages/packages"

      - name: Install test resources
        shell: bash
        run: |
          cd "${{ github.workspace }}/pkgs-test"
          python pkgs-test.py config --rtthread='${{ inputs.rt_thread_version }}'
          python pkgs-test.py config --bsps='${{ inputs.bsp }}'
          python pkgs-test.py config --pkgs='${{ inputs.packages }}'
          python pkgs-test.py download

      - name: Test package shard
        shell: bash
        run: |
          cd "${{ github.workspace }}/pkgs-test"
          python pkgs-test.py

      - name: Upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/pkgs-test/artifacts_export
          if-no-files-found: error
          retention-days: 7

  check-errors:
    name: Check ${{ inputs.artifact_name }}
    needs: packages-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RT-Thread/pkgs-test
          ref: 8bdeeb41a7ed6bb8658486b568190a9717f06e08

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Install tools
        shell: bash
        run: |
          python3 -m pip install requests tqdm wget dominate PyGithub pytz kconfiglib

      - name: Check shard results
        shell: bash
        run: python pkgs-test.py check --file=pkgs_res_single.json
