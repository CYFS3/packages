name: Packages Static Check

on:
  workflow_dispatch:

permissions: {}

jobs:
  url-check:
    name: URL shard ${{ matrix.label }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - shard_index: 0
            label: "1/8"
          - shard_index: 1
            label: "2/8"
          - shard_index: 2
            label: "3/8"
          - shard_index: 3
            label: "4/8"
          - shard_index: 4
            label: "5/8"
          - shard_index: 5
            label: "6/8"
          - shard_index: 6
            label: "7/8"
          - shard_index: 7
            label: "8/8"
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install URL checker dependencies
        run: python -m pip install requests

      - name: Validate package URLs and metadata
        run: python ci.py --shard-count 8 --shard-index ${{ matrix.shard_index }}
