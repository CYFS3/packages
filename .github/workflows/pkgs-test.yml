name: Packages Test

on:
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      rt_thread_versions:
        description: RT-Thread versions used by the manual package check
        required: true
        default: branch:master
        type: string
      bsps:
        description: BSPs used by the manual package check
        required: true
        default: qemu-vexpress-a9:sourcery-arm
        type: string
      shard_count:
        description: Package shards used by the manual package check
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "6"
          - "8"
          - "12"
      run_static_check:
        description: Run the full metadata and URL validation
        required: false
        default: false
        type: boolean
      create_failure_issue:
        description: Create or update the failure issue when this run fails
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: packages-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-pull-request-packages:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.changed-packages.outputs.packages }}
      has-packages: ${{ steps.changed-packages.outputs.has-packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect changed packages
        id: changed-packages
        shell: bash
        run: |
          packages="$(python tools/ci/detect_changed_packages.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          if [ -n "$packages" ]; then
            echo "has-packages=true" >> "$GITHUB_OUTPUT"
            echo "Changed packages: $packages" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has-packages=false" >> "$GITHUB_OUTPUT"
            echo "No package changes require compilation." >> "$GITHUB_STEP_SUMMARY"
          fi

  pull-request-packages:
    needs: detect-pull-request-packages
    if: ${{ github.event_name == 'pull_request' && needs.detect-pull-request-packages.outputs.has-packages == 'true' }}
    permissions:
      contents: read
    uses: RT-Thread/pkgs-test/.github/workflows/pkgs-action.yml@main
    with:
      pkgs: ${{ needs.detect-pull-request-packages.outputs.packages }}
      test-specific-pkgs: true
      package-test-all: false
      package-append-res: false
      check-errors: true
      deploy-pages: false

  tools-check:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: ./.github/workflows/aciont_tool.yml

  daily-static-check:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_static_check) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python-tk scons rxvt-unicode
          sudo apt-get -qq install -y gcc-multilib libc6:i386 libgcc1:i386 gcc-4.6-base:i386 libstdc++5:i386 libstdc++6:i386 libsdl-dev || true
          pip install requests tqdm wget html-table kconfiglib

      - name: Validate all package metadata
        shell: bash
        run: |
          BASE_ROOT="${{ github.workspace }}"
          cd ..
          mkdir packages_temp
          cp packages -R packages_temp
          mv packages_temp packages
          cd packages/packages_temp
          echo 'source "$PKGS_DIR/packages/Kconfig"' > Kconfig
          cd "$BASE_ROOT"
          export PKGS_ROOT="$BASE_ROOT/packages_temp"
          git clone --depth=1 --branch=master https://github.com/RT-Thread/rt-thread.git rt-thread
          export RTT_ROOT="$BASE_ROOT/rt-thread"
          export TERM=xterm
          cd "$RTT_ROOT/bsp/qemu-vexpress-a9"
          python -c 'import kconfiglib; kconfiglib.standard_kconfig()'
          cd "$PKGS_ROOT/packages"
          python ci.py

  prepare-package-shards:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package shard matrix
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHARDS: ${{ inputs.shard_count }}
          MANUAL_RT_THREAD_VERSIONS: ${{ inputs.rt_thread_versions }}
          MANUAL_BSPS: ${{ inputs.bsps }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            shard_count=12
            rt_thread_versions='branch:master tag:v4.1.1'
            bsps='stm32/stm32h750-artpi:sourcery-arm k210:sourcery-riscv-none-embed qemu-vexpress-a9:sourcery-arm'
          else
            shard_count="$MANUAL_SHARDS"
            rt_thread_versions="$MANUAL_RT_THREAD_VERSIONS"
            bsps="$MANUAL_BSPS"
          fi
          matrix="$(python tools/ci/build_package_shards.py \
            --shards "$shard_count" \
            --rt-thread-versions "$rt_thread_versions" \
            --bsps "$bsps")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Planned $(python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$matrix") package jobs." >> "$GITHUB_STEP_SUMMARY"

  daily-full-check:
    name: Full ${{ matrix.rt_thread_version }} ${{ matrix.bsp }} shard ${{ matrix.shard }}
    needs: prepare-package-shards
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.prepare-package-shards.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/pkgs-shard.yml
    with:
      rt_thread_version: ${{ matrix.rt_thread_version }}
      bsp: ${{ matrix.bsp }}
      packages: ${{ matrix.packages }}
      artifact_name: ${{ matrix.artifact_name }}

  report-daily-failure:
    needs:
      - daily-static-check
      - prepare-package-shards
      - daily-full-check
      - tools-check
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.create_failure_issue)) && (needs.daily-static-check.result == 'failure' || needs.prepare-package-shards.result == 'failure' || needs.daily-full-check.result == 'failure' || needs.tools-check.result == 'failure') }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      issues: write
    steps:
      - name: Create or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- daily-packages-check -->';
            const title = '[CI] Daily packages check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const staticResult = '${{ needs.daily-static-check.result }}';
            const planResult = '${{ needs.prepare-package-shards.result }}';
            const fullResult = '${{ needs.daily-full-check.result }}';
            const toolsResult = '${{ needs.tools-check.result }}';
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100,
            });
            const failedJobs = jobs
              .filter((job) => job.conclusion === 'failure')
              .slice(0, 20)
              .map((job) => `  - [${job.name}](${job.html_url})`);
            const details = [
              marker,
              '@rb666 @cyfs',
              '',
              '每日全量检查失败，请协助处理。',
              '',
              `- 静态检查：${staticResult}`,
              `- 分片计划：${planResult}`,
              `- 全量编译：${fullResult}`,
              `- ToolsCI：${toolsResult}`,
              `- Commit：${context.sha}`,
              `- 运行记录：${runUrl}`,
              '',
              '失败 Jobs：',
              ...(failedJobs.length ? failedJobs : ['  - 请查看运行记录中的失败步骤。']),
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) =>
              !issue.pull_request && issue.title === title && issue.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: details,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: details,
              });
            }
